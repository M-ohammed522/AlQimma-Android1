name: Build AlQimma Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q AlQimma_Android_Local_Offline_Final.zip -d project

      - name: Enter project
        run: |
          echo "PROJECT_DIR=project/phase3/android_build" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: project/phase3/android_build
        run: npm install --no-audit --no-fund

      - name: Build web application
        working-directory: project/phase3/android_build
        run: npm run build

      - name: Add Android platform
        working-directory: project/phase3/android_build
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: project/phase3/android_build
        run: npx cap sync android

      - name: Build APK
        working-directory: project/phase3/android_build/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQimma-Android-APK
          path: project/phase3/android_build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
