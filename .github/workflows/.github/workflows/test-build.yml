name: Test Original Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract original project
        run: |
          unzip -q AlQimma_System_Full_Package_20261020.zip -d app
          cd app
          ls -la

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: app
        run: npm run build
